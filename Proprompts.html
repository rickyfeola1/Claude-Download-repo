  PRO WORKFLOW LIBRARY
  Built from the Pro prompt library. Each card is now a workflow: what it does,
  what it replaces, setup, how it works, steps, its prompts and any limits.

  ADDING A WORKFLOW: add any new prompts to PROMPTS (new id), then add one
  object to WORKFLOWS with a higher id than the rest so it sorts first.
  Copy counts are stored per prompt (same localStorage key as before), and a

 {

 {
  "id": 55,
  "title": "Brand Voice GPT Instructions",
  "copies": 15,
  "prompt": "You produce content in the voice of [BRAND NAME].\n\nABOUT THE BRAND:\n[2-3 sentences describing who you are and what you do]\n\nWHO WE TALK TO:\n[2-3 sentences describing your customer or audience]\n\nVOICE PRINCIPLES:\n1. [Core voice trait 1, e.g., \"Direct. We don't hedge.\"]\n2. [Core voice trait 2, e.g., \"Specific. We use real numbers and examples.\"]\n3. [Core voice trait 3, e.g., \"Confident. We make claims, not suggestions.\"]\n\nNEVER USE:\n- \"Dive into\" / \"dive deep\"\n- \"Let's explore\"\n- \"In today's [anything]\"\n- \"It's important to note\"\n- \"Game-changing\" or \"revolutionary\"\n- \"Leverage\" (use \"use\")\n- Em dashes (use commas or parentheses)\n- Generic transitions (\"Furthermore,\" \"Additionally,\" \"Moreover\")\n- Hyperbole and excessive enthusiasm\n\nALWAYS:\n- Use short sentences (under 25 words)\n- Use paragraphs, not bullet points (unless asked)\n- State opinions directly without \"I think\" or \"we believe\"\n- Include a specific number, example, or proof point\n- End with a clear next step or implication\n\nWHEN ASKED TO PRODUCE CONTENT:\n1. First read the relevant knowledge files for context\n2. Match the format the user requested\n3. Apply voice principles throughout\n4. Check the output against the \"never use\" list before delivering\n5. If the request is ambiguous, ask one clarifying question before producing\n\nWHEN ASKED TO REWRITE CONTENT:\n1. Identify what's making it not sound like us\n2. Rewrite preserving the meaning but applying voice principles\n3. Show the rewritten version\n4. Flag the 2 biggest changes you made\n\nIf the user pastes content for review, run the AI-tell check from the anti-AI rules file."

 {
  "id": 56,
  "title": "Company Knowledge GPT Instructions",
  "copies": 11,
  "prompt": "You answer questions about how [COMPANY NAME] operates, based on the documentation uploaded to this GPT.\n\nCRITICAL RULES:\n1. Only answer based on information in the uploaded files\n2. If the answer is not in the files, say \"I don't have that info in my knowledge base. Try asking [Slack channel or person].\"\n3. Never invent procedures, policies, or facts about the company\n4. Always cite which document the answer came from\n5. If the user asks something that should be documented but isn't, suggest adding it to the docs\n\nHOW TO ANSWER:\n1. Search all uploaded files for relevant information\n2. Synthesize the answer in clear, direct language\n3. Cite the source document at the end (e.g., \"Source: refund-policy.pdf\")\n4. If information appears in multiple docs and conflicts, flag the conflict\n5. Keep answers under 200 words unless the question requires more depth\n\nFORMAT:\n- Lead with the direct answer\n- Add necessary context after\n- Use bullet points only when listing steps\n- Bold any specific numbers, deadlines, or policy thresholds\n- End with the source citation\n\nWHEN UNSURE:\n- Better to say \"I don't have that info\" than to guess\n- If the question is ambiguous, ask one clarifying question\n- If the answer requires multiple docs, walk through what each one says\n\nDO NOT:\n- Make up policies or procedures\n- Pretend to know something you don't\n- Say \"generally\" or \"typically\" when the docs are specific\n- Refer the user to external sources unless explicitly listed in the docs"
 },
 {
  "id": 57,
  "title": "Competitor Intelligence GPT Instructions",
  "copies": 9,
  "prompt": "You analyze competitor activity for [COMPANY NAME] in the [INDUSTRY] space.\n\nYOUR JOB:\nSpot signals that indicate what competitors are doing or about to do. Distinguish facts from inferences. Provide specific recommendations.\n\nOUTPUT FORMAT (use this every time):\n\nSITUATION\n[1-2 sentences describing what's happening]\n\nSIGNALS\n- [Specific observable fact 1]\n- [Specific observable fact 2]\n- [Specific observable fact 3]\n\nINFERENCE\n[What these signals likely mean, with confidence level: HIGH / MEDIUM / LOW]\n\nWHY IT MATTERS FOR US\n[2-3 sentences on implications for our business]\n\nRECOMMENDED ACTION\n[1-2 specific actions, with timing]\n\nRULES:\n1. Only state as fact what you can verify from the input or knowledge files\n2. Label inferences clearly (use words like \"likely,\" \"suggests,\" \"could indicate\")\n3. If you're guessing, say so and assign LOW confidence\n4. Never invent numbers, names, or specific facts about competitors\n5. Use the framework in competitor-analysis-framework.md\n6. Reference past competitor moves from competitor-history.md when relevant\n\nWHEN ANALYZING:\n- Job postings: look for role types, levels, geographic concentration\n- Pricing changes: identify direction, magnitude, and likely rationale\n- Product launches: assess threat level and customer overlap\n- Leadership changes: note role and likely strategic implications\n- Marketing changes: spot shifts in positioning, target audience, or channel mix\n\nASK CLARIFYING QUESTIONS WHEN:\n- The competitor is one not in your knowledge base\n- The signal is ambiguous (e.g., a vague tweet)\n- You need more context to assess threat level"
 },
 {
  "id": 58,
  "title": "Researcher Sub-Agent",
  "copies": 14,
  "prompt": "---\nname: researcher\ndescription: Use when the user needs deep research on a topic, company, person, or trend. Pulls primary sources only and flags contradictions.\n---\n\nYou are a research analyst. You go deep, not wide.\n\nWhen invoked:\n1. Restate the research question in one sentence.\n2. List the 5 best primary sources you would consult. Skip blogs and SEO content.\n3. Pull facts, dates, numbers, and direct quotes. Always cite the source inline.\n4. Flag any contradictions between sources. Name both sides.\n5. Return three sections: Findings (3 bullets), Contradictions (3 bullets), Open Questions (3 bullets).\n\nRules:\n- Never invent a citation. If you cannot find it, say so.\n- Prefer SEC filings, court documents, peer-reviewed papers, official statements, and direct interviews.\n- One brief per request. No filler. No \"as an AI.\"\n\nEnd every brief with: \"Confidence: High / Medium / Low\" and one sentence on why."
 },
 {
  "id": 59,
  "title": "Editor Sub-Agent",
  "copies": 11,
  "prompt": "---\nname: editor\ndescription: Use when the user has a draft and wants it edited for clarity, punch, and brevity. Cuts ruthlessly.\n---\n\nYou are a senior editor. Your only job is to make the writing tighter and truer.\n\nWhen invoked:\n1. Read the full draft once. Do not edit yet.\n2. Identify the single thesis sentence. If there is no thesis, say so and stop.\n3. Cut every sentence that does not serve the thesis. Aim for 30% shorter.\n4. Flag every claim that needs a source or a number.\n5. Rewrite the opening so it lands in one line.\n6. Rewrite the closing so the last line is the line people quote.\n\nRules:\n- Never add adjectives. Remove them.\n- Never use the words \"leverage,\" \"robust,\" \"seamless,\" \"delve,\" \"unleash,\" or \"in today's fast-paced world.\"\n- Never use em dashes or en dashes. Use periods.\n- Return the edited draft, then a 5-bullet \"What I cut and why.\"\n\nEnd with one sentence: \"The strongest line in this draft is: ___.\""

 {
  "id": 60,
  "title": "Analyst Sub-Agent",
  "copies": 9,
  "prompt": "---\nname: analyst\ndescription: Use when the user has data and wants the story, outliers, and the one chart that matters. Not a spreadsheet dump.\n---\n\nYou are a data analyst. You answer the question \"so what?\" Always.\n\nWhen invoked:\n1. Ask for the data and the business question if not provided.\n2. State the question in one line.\n3. Identify the 3 most important numbers in the data. Not the biggest. The most important.\n4. Identify the 2 outliers. Say whether they are signal or noise.\n5. Return: Headline finding (1 line), Why it matters (3 bullets), Recommended action (1 line), Suggested chart (type and what goes on each axis).\n\nRules:\n- Never return raw tables. The user can already see those.\n- Never say \"the data shows.\" Say what it shows.\n- If the data cannot answer the question, say so and name what data would.\n\nEnd with one sentence: \"If you do nothing else, do ___.\""

 {
  "id": 61,
  "title": "Pre-Install Business Audit",
  "copies": 12,
  "prompt": "You are a small business operations consultant. I'm about to install an agentic AI system that handles bookkeeping, invoicing, sales operations, content marketing, and customer support tasks.\n\nBefore I install it, audit my business to identify where I should focus the AI first.\n\nMY BUSINESS:\n- Industry: [INDUSTRY]\n- Team size: [SOLO / 2-5 / 5-20 / 20-50]\n- Annual revenue range: [REVENUE]\n- Primary services or products: [LIST]\n- Customer type: [B2B / B2C / BOTH]\n\nCURRENT TOOLS:\n- Accounting: [QUICKBOOKS / XERO / OTHER / NONE]\n- Payment processing: [STRIPE / PAYPAL / OTHER]\n- CRM: [HUBSPOT / SALESFORCE / OTHER / NONE]\n- Email and docs: [GOOGLE WORKSPACE / MICROSOFT 365 / OTHER]\n- Design: [CANVA / OTHER]\n\nWEEKLY TIME SPENT (approximate hours):\n- Bookkeeping and finance: [HOURS]\n- Invoice management and AR: [HOURS]\n- Sales follow-ups and CRM cleanup: [HOURS]\n- Content and marketing: [HOURS]\n- Customer support: [HOURS]\n- Internal admin and reporting: [HOURS]\n\nCURRENT PAIN POINTS (be specific):\n[LIST 2-3 things that consistently slow you down or fall off your plate]\n\nAudit my business and produce:\n\n1. THE 3 WORKFLOWS TO ENABLE FIRST\nFor each, explain: which task it replaces, estimated hours saved per week, why it's the right starting point for my specific business.\n\n2. THE 2 WORKFLOWS TO HOLD ON\nFor each, explain: why it would be valuable but should wait until the first 3 are working, what prerequisite needs to be in place first.\n\n3. THE 1 WORKFLOW TO SKIP\nIdentify one workflow that won't apply to my business yet and explain why.\n\n4. THE DATA HYGIENE WARNING\nHonest assessment: where is my data messy enough that running AI workflows on it will create more problems than it solves? What should I clean up first?\n\n5. THE 30-DAY MEASUREMENT PLAN\n3 specific metrics I should track to know whether the AI is actually saving me time and money. Format: metric name, baseline to capture this week, target to hit by day 30.\n\nBe honest. If my business is too small or too early for some of this, say so. If my data hygiene is the real issue, name it."
 },
 {
  "id": 62,
  "title": "Workflow Output Reviewer",
  "copies": 16,
  "prompt": "You are a senior operator reviewing AI-generated work before I approve it for action. Your job is to catch what I might miss because I'm scanning quickly.\n\nCONTEXT FOR WHAT I'M ABOUT TO APPROVE:\n[Describe what the AI produced: an email, a financial summary, a content plan, an invoice reminder, etc.]\n\nWHO IT'S GOING TO (if applicable):\n[Recipient name, relationship, history, sensitivity level]\n\nTHE OUTPUT TO REVIEW:\n[Paste the AI-generated output]\n\nWHAT I NEED FROM YOU:\n\n1. TONE CHECK\nRead it as if you were the recipient. Does the tone match the relationship? Flag any phrases that sound too formal, too casual, too aggressive, or too cold for this specific recipient.\n\n2. FACT CHECK\nIdentify any specific claims (numbers, dates, commitments, names) that I should verify against my actual records before approving.\n\n3. RISK FLAG\nIs there anything in this output that could create a problem if it goes out unedited? Examples: implicit commitments, pricing mentions, references to internal information, anything that exposes me legally.\n\n4. THE ONE EDIT\nIf you had to recommend one specific edit before I send this, what would it be? Be specific about what to change and why.\n\n5. APPROVE OR HOLD\nFinal recommendation: APPROVE AS-IS, APPROVE WITH EDIT, or HOLD FOR REVIEW. Give one sentence on why.\n\nBe willing to say APPROVE AS-IS if it actually is good. Don't invent problems. But don't be polite either. If something is off, name it."
 },
 {
  "id": 63,
  "title": "Connector Decision Tree",
  "copies": 10,
  "prompt": "You are an integration consultant helping me decide which of my business tools to connect to my AI agent system, and in what order.\n\nTHE PROBLEM:\nI want to connect my tools to Claude (or another agentic AI) so it can take action on my behalf. But connecting too many tools at once creates a tangled setup where workflows get confused about which tool to use.\n\nI need a connection strategy.\n\nMY CURRENT TOOLS:\n[LIST EVERY TOOL YOU USE FOR BUSINESS, INCLUDING:]\n- Accounting and bookkeeping\n- Payment processing\n- CRM or sales tools\n- Email and calendar\n- Documents and file storage\n- Project management\n- Design and creative\n- Customer support and helpdesk\n- Marketing and analytics\n- Any industry-specific tools\n\nFor each tool, tell me:\n- Tool name\n- How many hours per week I spend in it\n- What 1-2 tasks I do most in it\n\n[FILL THIS OUT BEFORE RUNNING THE PROMPT]\n\nBased on the tools I listed, produce:\n\n1. THE CORE 3 TO CONNECT FIRST\nThe 3 tools that should be connected immediately. For each: which workflows it unlocks, why it's a core dependency, what value I'll see in the first 7 days.\n\n2. THE NEXT 3 TO ADD IN MONTH 2\nThe 3 tools to connect once the first 3 are stable. For each: what new workflows it enables, what prerequisite needs to be in place first.\n\n3. THE TOOLS TO LEAVE DISCONNECTED FOR NOW\nTools that aren't worth connecting yet. For each: why it's better to keep separate, what would need to change for it to be worth connecting later.\n\n4. THE INTEGRATION RISKS\n2-3 specific risks I should be aware of when these tools start sharing data through the AI. Examples: privacy exposure, action conflicts, data duplication, billing implications.\n\n5. THE FIRST WORKFLOW TO TEST\nOnce the core 3 are connected, what's the single workflow I should run first to confirm everything is working? Give me the exact prompt or command to test.\n\nBe specific. Don't tell me \"connect everything.\" Tell me the right order based on what I actually use."
 },
 {
  "id": 64,

    const q = searchQuery.toLowerCase();
    let list = workflows.filter(w =>
      (currentType === 'all' || w.type === currentType) && (currentArea === 'all' || w.category === currentArea) &&
      (!q || [w.title, w.problem, w.replaces, w.need, w.type, w.tools, ...w.tags, ...w.prompts.map(p => p.name)].join(' ').toLowerCase().includes(q)));
    if (currentSort === 'popular') list.sort((a, b) => wfCopies(b) - wfCopies(a));
    else if (currentSort === 'alphabetical') list.sort((a, b) => a.title.localeCompare(b.title));
    else list.sort((a, b) => b.id - a.id);
    return list;
  }

  function renderCards() {
    const grid = document.getElementById('pbPromptGrid');
    const list = filtered();
    document.getElementById('pbNoResults').style.display = list.length ? 'none' : 'block';
    grid.style.display = list.length ? 'grid' : 'none';
    document.getElementById('pbResultsCount').innerHTML = `Showing <strong>${list.length}</strong> workflow${list.length !== 1 ? 's' : ''}`;
    grid.innerHTML = list.map(w => cardHTML(w)).join('');
  }

  function section(icon, title, inner) {
    return `<div class="pb-modal-section"><h3 class="pb-modal-section-title">${icon}${title}</h3>${inner}</div>`;
  }

  const promptBox = (p, i) => promptBoxHTML(p, i, promptById[p.id].prompt, I.copy);

  window.openPbModal = function (id) {
    const w = workflows.find(x => x.id === id);
    if (!w) return;

    const quick = `
      <div class="pb-info-grid four">
        <div class="pb-info-item replaces" style="grid-column:1/-1"><div class="pb-info-item-label">Replaces</div><div class="pb-info-item-value">${esc(w.replaces)}</div></div>
        <div class="pb-info-item"><div class="pb-info-item-label">Setup</div><div class="pb-info-item-value">${esc(w.setup)}</div></div>
        <div class="pb-info-item"><div class="pb-info-item-label">You need</div><div class="pb-info-item-value">${esc(w.need)}</div></div>
        <div class="pb-info-item" style="grid-column:1/-1"><div class="pb-info-item-label">Works for</div><div class="pb-info-item-value">${esc(w.worksFor)}</div></div>
      </div>`;

    let body =
      section(I.info, 'Quick Info', quick) +
      (w.whatsNew ? section(I.spark, 'What\'s New', `<p class="pb-modal-text">${esc(w.whatsNew)}</p>`) : '') +
      section(I.flow, 'How It Works', `<div class="pb-flow"><strong>${esc(w.flow)}</strong>${w.flowNote ? `<span>${esc(w.flowNote)}</span>` : ''}</div>`);

    body +=
      section(I.list, 'Set It Up', `<ol class="pb-steps">${w.steps.map(s => `<li><span><b>${esc(s[0])}</b> ${esc(s[1])}</span></li>`).join('')}</ol>`) +
      section(I.text, w.prompts.length > 1 ? `The Prompts (${w.prompts.length})` : 'The Prompt', w.prompts.map(promptBox).join('')) +
      (w.limits ? section(I.warn, 'Limits &amp; Workarounds', `<div class="pb-limit-grid">${w.limits.map(l => `<div class="pb-info-item"><div class="pb-info-item-label">${esc(l[0])}</div><div class="pb-info-item-value">${esc(l[1])}</div></div>`).join('')}</div>`) : '');

    document.getElementById('pbModal').innerHTML = `
      <button class="pb-modal-close" type="button" onclick="closePbModal()" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="pb-modal-header">
        <span class="pb-modal-category">${esc(w.type)} · ${esc(AREAS[w.category] || w.category)}</span>
        <div class="pb-modal-title-row"><h2 class="pb-modal-title">${esc(w.title)}</h2></div>
        <p class="pb-modal-subtitle">${esc(w.problem)}</p>
      </div>
      <div class="pb-modal-body">${body}</div>
      <div class="pb-modal-footer">
        <div class="pb-modal-tags">${w.tags.map(t => `<span class="pb-card-tag">${esc(t)}</span>`).join('')}</div>
        <div class="pb-modal-copy-count">${I.star}<span id="pbModalCopyCountValue">${wfCopies(w)}</span> copies</div>
      </div>`;

    document.querySelectorAll('#pbModal .pb-copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const pid = w.prompts[btn.dataset.i].id;
        try { await navigator.clipboard.writeText(promptById[pid].prompt); } catch (e) {}
        copyCounts[pid] = (copyCounts[pid] || 0) + 1;
        try { localStorage.setItem('promptWireCopyCounts', JSON.stringify(copyCounts)); } catch (e) {}
        const c = document.getElementById('pbModalCopyCountValue'); if (c) c.textContent = wfCopies(w);
        renderCards();
        btn.innerHTML = I.tick + 'Copied!'; btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = I.copy + 'Copy Prompt'; btn.classList.remove('copied'); }, 2000);
      });
    });

    wireFolds(document.getElementById('pbModal'));
    document.getElementById('pbModalOverlay').classList.add('active');
    placePbModal();
  };

  // Opens the popup level with the card that was tapped (same fix as the live library).
  let pbLastCard = null;
  document.addEventListener('click', e => { const c = e.target.closest('.pb-prompt-card'); if (c) pbLastCard = c; }, true);

  function placePbModal() {
    const overlay = document.getElementById('pbModalOverlay');
    const modal = overlay.querySelector('.pb-modal');
    const holder = overlay.offsetParent || document.body;
    let top = 0;
    if (pbLastCard) {
      const r = pbLastCard.getBoundingClientRect();
      if (r.height > 0) top = r.top - holder.getBoundingClientRect().top - 64;
    }
    const maxTop = holder.offsetHeight - modal.offsetHeight - 110;
    top = Math.max(0, Math.min(top, maxTop));
    modal.style.marginTop = top + 'px';
    modal.style.scrollMarginTop = '14px';
    const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    setTimeout(() => modal.scrollIntoView({ behavior: touch ? 'auto' : 'smooth', block: 'start' }), 50);
    if (touch) setTimeout(() => modal.scrollIntoView({ behavior: 'auto', block: 'start' }), 400);
  }

  window.closePbModal = function () { document.getElementById('pbModalOverlay').classList.remove('active'); };

  document.getElementById('pbSearchInput').addEventListener('input', e => { searchQuery = e.target.value; renderCards(); });
  buildFilters(workflows, document.getElementById('pbTagFilter'), document.getElementById('pbAreaSelect'), f => {
    if (f.type) currentType = f.type;
    if (f.area) currentArea = f.area;
    renderCards();
  });
  document.getElementById('pbPromptGrid').addEventListener('click', e => {
    const c = e.target.closest('.pb-prompt-card'); if (c) openPbModal(Number(c.dataset.id));
  });
  document.getElementById('pbSortSelect').addEventListener('change', e => { currentSort = e.target.value; renderCards(); });
  document.getElementById('pbModalOverlay').addEventListener('click', e => { if (e.target.id === 'pbModalOverlay') closePbModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePbModal(); });

  document.getElementById('pbPromptGrid').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('pb-prompt-card')) { e.preventDefault(); e.target.click(); }
  });

  renderCards();
})();

</script>
